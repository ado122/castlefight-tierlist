<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Castle Fight Legendary Tiers</title>
<meta name="description" content="Drag-and-drop tier list of the 14 legendary (X) buildings in Castle Fight DE. Share your list with a link.">
<meta property="og:title" content="Castle Fight Legendary Tiers">
<meta property="og:description" content="Rank the 14 legendary buildings of Castle Fight DE and share your list.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one column; a stone-slab tier board with the controls above it. Dark Warcraft-UI look on purpose. */
:root {
  color-scheme: dark;
  --bg: #12151b;
  --slab: #1a1f28;
  --slab-2: #222935;
  --line: #2f3846;
  --fg: #ece3cc;
  --muted: #a39b88;
  --gold: #d4a94f;
  --ok: #7fbf6a;
  --tier-s: #c8553d;
  --tier-a: #d98a3a;
  --tier-b: #cdb653;
  --tier-c: #7fa86a;
  --tier-d: #5f8fb5;
  --tier-pool: #3a4352;
  --font-display: "Cinzel", "Trajan Pro", Georgia, serif;
  --font-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --tile: 68px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 28px 48px;
}
.wrap { max-width: 980px; margin-inline: auto; display: grid; gap: 22px; }
a { color: var(--gold); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

header { display: grid; gap: 10px; }
.eyebrow { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 5.5vw, 46px); line-height: 1.1; margin: 0; letter-spacing: .02em; text-wrap: balance; }
h1 em { font-style: normal; color: var(--gold); }
.lede { margin: 0; max-width: 60ch; color: var(--muted); }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar .sep { width: 1px; height: 28px; background: var(--line); margin-inline: 4px; }
button {
  font: 500 15px/1 var(--font-body);
  color: var(--fg);
  background: var(--slab-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 9px 14px;
  cursor: pointer;
}
button:hover { border-color: var(--gold); }
button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
button.primary { background: var(--gold); color: var(--bg); border-color: var(--gold); font-weight: 700; }
.toast { font-size: 14px; color: var(--ok); min-height: 1em; }

.board { background: var(--slab); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.row { display: grid; grid-template-columns: 84px minmax(0, 1fr); border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.label {
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: 36px;
  color: var(--bg);
  min-height: calc(var(--tile) + 18px);
}
.row[data-tier="S"] .label { background: var(--tier-s); }
.row[data-tier="A"] .label { background: var(--tier-a); }
.row[data-tier="B"] .label { background: var(--tier-b); }
.row[data-tier="C"] .label { background: var(--tier-c); }
.row[data-tier="D"] .label { background: var(--tier-d); }
.row[data-tier="pool"] .label { background: var(--tier-pool); color: var(--muted); font: 700 12px/1.2 var(--font-body); letter-spacing: .12em; text-transform: uppercase; text-align: center; padding: 6px; }
.zone { display: flex; flex-wrap: wrap; gap: 7px; padding: 9px; min-height: calc(var(--tile) + 18px); align-content: flex-start; }

.tile {
  width: var(--tile); height: var(--tile);
  border-radius: 4px;
  border: 2px solid #59606c;
  background: #0b0d11;
  cursor: grab;
  touch-action: none;
  user-select: none;
  padding: 0;
}
.tile img { width: 100%; height: 100%; display: block; border-radius: 2px; pointer-events: none; }
.tile:hover { border-color: var(--gold); }
.sortable-ghost { opacity: .35; }
.sortable-chosen { cursor: grabbing; }

.hover-name { min-height: 1.5em; color: var(--muted); font-size: 15px; }
.hover-name strong { color: var(--fg); font-weight: 700; }
footer { color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); padding-top: 14px; }

@media (max-width: 520px) {
  :root { --tile: 54px; }
  .row { grid-template-columns: 56px minmax(0, 1fr); }
  .label { font-size: 28px; }
  .row[data-tier="pool"] .label { font-size: 10px; letter-spacing: .06em; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Castle Fight DE · Legendary buildings</div>
    <h1>Legendary <em>Tiers</em></h1>
    <p class="lede">Drag the 14 legendary buildings into tiers. Your list is saved in the page link, so copy it to share.</p>
    <div class="toolbar" role="toolbar" aria-label="Tier list controls">
      <button type="button" data-preset="data">Data preset</button>
      <button type="button" data-preset="ado">Ado's list</button>
      <button type="button" data-preset="empty">Start empty</button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" id="copy" class="primary">Copy share link</button>
      <button type="button" id="png">Download PNG</button>
      <span class="toast" id="toast" role="status" aria-live="polite"></span>
    </div>
  </header>

  <div class="board" id="board">
    <div class="row" data-tier="S"><div class="label">S</div><div class="zone" data-tier="S"></div></div>
    <div class="row" data-tier="A"><div class="label">A</div><div class="zone" data-tier="A"></div></div>
    <div class="row" data-tier="B"><div class="label">B</div><div class="zone" data-tier="B"></div></div>
    <div class="row" data-tier="C"><div class="label">C</div><div class="zone" data-tier="C"></div></div>
    <div class="row" data-tier="D"><div class="label">D</div><div class="zone" data-tier="D"></div></div>
    <div class="row" data-tier="pool"><div class="label">Unranked</div><div class="zone" data-tier="pool"></div></div>
  </div>
  <div class="hover-name" id="hover-name" aria-live="polite">Hover or tap a building to see its name.</div>

  <footer>Made for the Castle Fight community. Building icons from <a href="https://castlefight.cfd" target="_blank" rel="noopener">castlefight.cfd</a>.</footer>
</div>

const PRESETS = {
  data:  { S: ["wf", "pp"], A: ["eye", "cod", "tos"], B: ["era", "lnk", "tg", "lt"], C: ["sfo", "gsj", "cct", "hs"], D: ["aow"] },
  ado:   { S: ["pp", "tos", "wf"], A: ["tg", "cod", "era", "eye"], B: ["gsj", "sfo", "lt", "cct", "lnk"], C: ["hs", "aow"], D: [] },
  empty: {}
};
const RANKED = ["S", "A", "B", "C", "D"];
const byId = Object.fromEntries(B.map(b => [b.id, b]));
const zones = Object.fromEntries([...document.querySelectorAll(".zone")].map(z => [z.dataset.tier, z]));
const hoverName = document.getElementById("hover-name");

function showName(b) {
  hoverName.innerHTML = "<strong>" + b.name + "</strong> · " + b.race;
}

function tileEl(b) {
  const t = document.createElement("button");
  t.type = "button";
  t.className = "tile";
  t.dataset.id = b.id;
  t.title = b.name + " (" + b.race + ")";
  t.setAttribute("aria-label", b.name + ", " + b.race);
  t.innerHTML = '<img alt="" src="' + b.icon + '">';
  t.addEventListener("mouseenter", () => showName(b));
  t.addEventListener("focus", () => showName(b));
  t.addEventListener("click", () => showName(b));
  return t;
}

function layout(arr) {
  const placed = new Set();
  for (const z of Object.values(zones)) z.innerHTML = "";
  for (const tier of RANKED) {
    for (const id of arr[tier] || []) {
      if (byId[id] && !placed.has(id)) { zones[tier].appendChild(tileEl(byId[id])); placed.add(id); }
    }
  }
  for (const b of B) if (!placed.has(b.id)) zones.pool.appendChild(tileEl(b));
  sync();
}

function current() {
  const out = {};
  for (const tier of RANKED) out[tier] = [...zones[tier].children].map(t => t.dataset.id);
  return out;
}
const encode = arr => RANKED.map(t => t + "=" + (arr[t] || []).join(".")).join("~");
function decode(hash) {
  const out = {};
  hash.replace(/^#/, "").split("~").forEach(part => {
    const [t, ids] = part.split("=");
    if (RANKED.includes(t)) out[t] = (ids || "").split(".").filter(Boolean);
  });
  return out;
}

function sync() {
  const enc = encode(current());
  try { history.replaceState(null, "", "#" + enc); } catch (e) { /* ignore */ }
  const match = Object.entries(PRESETS).find(([, p]) => encode(p) === enc);
  document.querySelectorAll("[data-preset]").forEach(btn => btn.setAttribute("aria-pressed", String(!!match && btn.dataset.preset === match[0])));
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => (el.textContent = ""), 2600);
}

document.querySelectorAll("[data-preset]").forEach(btn => btn.addEventListener("click", () => layout(PRESETS[btn.dataset.preset])));

document.getElementById("copy").addEventListener("click", () => {
  const url = location.href.split("#")[0] + "#" + encode(current());
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(() => toast("Link copied"), () => fallbackCopy(url));
  } else fallbackCopy(url);
});
function fallbackCopy(url) {
  const ta = document.createElement("textarea");
  ta.value = url; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("Link copied"); } catch (e) { toast("Copy the link from the address bar"); }
  ta.remove();
}

document.getElementById("png").addEventListener("click", async () => {
  if (!window.html2canvas) { toast("Image export did not load. Take a screenshot instead."); return; }
  const canvas = await html2canvas(document.getElementById("board"), { backgroundColor: getComputedStyle(document.body).backgroundColor, scale: 2 });
  canvas.toBlob(blob => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "castlefight-legendary-tiers.png";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast("PNG saved");
  });
});

if (window.Sortable) {
  for (const z of Object.values(zones)) {
    Sortable.create(z, { group: "tiers", animation: 150, ghostClass: "sortable-ghost", chosenClass: "sortable-chosen", onSort: sync });
  }
}

const fromHash = location.hash.length > 2 ? decode(location.hash) : null;
layout(fromHash && Object.values(fromHash).some(a => a.length) ? fromHash : PRESETS.data);
</script>
